<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای ایلار 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{
background:linear-gradient(135deg,#faf7f2,#f8f4ee,#fffdf9);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:hidden;
transition:1s;
}

.card{
width:100%;
max-width:700px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(15px);
border-radius:30px;
padding:50px 35px;
text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.08);
border:1px solid rgba(255,255,255,.7);
animation:show 1s ease;
}

@keyframes show{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.page{
display:none;
animation:fade .6s ease;
}

.page.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
font-size:38px;
color:#a67c52;
margin-bottom:25px;
}

p{
font-size:20px;
line-height:2.4;
color:#444;
}

.buttons{
margin-top:40px;
display:flex;
justify-content:center;
gap:12px;
}

button{
border:none;
padding:12px 28px;
border-radius:15px;
cursor:pointer;
font-size:16px;
transition:.3s;
}

.next{
background:#c9a86a;
color:white;
}

.prev{
background:#ece7de;
color:#444;
}

button:hover{
transform:translateY(-3px);
}

.heart-btn{
position:fixed;
top:20px;
left:20px;
width:55px;
height:55px;
border-radius:50%;
background:white;
font-size:24px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

.footer{
margin-top:30px;
font-size:14px;
color:#888;
}

.heart{
position:fixed;
font-size:25px;
pointer-events:none;
animation:float 4s linear forwards;
}

@keyframes float{
0%{
opacity:1;
transform:translateY(0) scale(0.5);
}
100%{
opacity:0;
transform:translateY(-800px) scale(1.5);
}
}

.heart-mode{
background:linear-gradient(135deg,#ffe7ee,#fff1f5,#fff7fa);
}

</style>
</head>

<body>

<div class="heart-btn" onclick="loveExplosion()">🤍</div>

<div class="card">

<div class="page active">

<h1>سلام 🤍</h1>

<p>
دلم برات تنگ شده...
<br><br>
برای همین تصمیم گرفتم
به جای یه پیام معمولی
یه چیز کوچیک برات بسازم.
</p>

</div>

<div class="page">

<h1>یه اعتراف کوچیک</h1>

<p>
راستش...
<br><br>
چند بار خواستم بهت پیام بدم،
چ
