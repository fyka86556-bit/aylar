<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Aylar Chat ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:tahoma,sans-serif;
background:linear-gradient(135deg,#ffb6c1,#d7a8ff);
}

.chat-app{
height:100vh;
display:flex;
flex-direction:column;
}

.header{
height:65px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
color:white;
font-size:24px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,.2);
}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.message{
max-width:80%;
padding:12px 15px;
background:white;
border-radius:18px;
font-size:15px;
word-wrap:break-word;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.input-area{
display:flex;
gap:10px;
padding:12px;
padding-bottom:max(12px,env(safe-area-inset-bottom));
background:white;
border-top:1px solid #eee;
}

.input-area input{
flex:1;
height:48px;
border:none;
outline:none;
background:#f4f4f4;
border-radius:14px;
padding:0 15px;
font-size:16px;
}

.input-area button{
width:60px;
border:none;
border-radius:14px;
background:#ff4f8b;
color:white;
font-size:18px;
font-weight:bold;
}

.input-area button:active{
transform:scale(.97);
}

</style>
</head>

<body>

<div class="chat-app">

<div class="header">
❤️ Aylar Chat ❤️
</div>

<div id="messages" class="messages"></div>

<div class="input-area">
<input
id="messageInput"
type="text"
placeholder="پیام بنویس..."
autocomplete="off">
<button onclick="sendMessage()">➤</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCbxQaCdabzJb7k_eNZYJDvRIv9F0s48_k",
authDomain: "aylarchat-3288b.firebaseapp.com",
projectId: "aylarchat-3288b",
storageBucket: "aylarchat-3288b.firebasestorage.app",
messagingSenderId: "284766593950",
appId: "1:284766593950:web:4b5407035ab3423284ec8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendMessage = async function(){

const input=document.getElementById("messageInput");
const text=input.value.trim();

if(text==="") return;

await addDoc(collection(db,"messages"),{
text:text,
time:Date.now()
});

input.value="";
}

document.getElementById("messageInput").addEventListener("keypress",(e)=>{
if(e.key==="Enter"){
sendMessage();
}
});

const q=query(
collection(db,"messages"),
orderBy("time")
);

onSnapshot(q,(snapshot)=>{

const box=document.getElementById("messages");

box.innerHTML="";

snapshot.forEach((doc)=>{

const data=doc.data();

const div=document.createElement("div");

div.className="message";

div.textContent=data.text;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

</script>

</body>
</html>
